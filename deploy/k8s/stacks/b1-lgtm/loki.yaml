# B1 Loki: compose service `loki` on the grafana-community chart, one single-binary pod. Its config is
# stacks/b1-lgtm/config/loki.yaml byte for byte, from the loki-config ConfigMap of release otb-config; the chart
# generates none. Resources come from the profile.
fullnameOverride: loki
deploymentMode: Monolithic

loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
  configStorageType: ConfigMap
  configObjectName: loki-config
  generatedConfigObjectName: ""
  # read only by chart templates (the config above is the one Loki runs); kept equal to it
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true

singleBinary:
  replicas: 1
  targetModule: all
  sidecar: false
  affinity: {}
  podDisruptionBudget:
    enabled: false
  podLabels: {otb.stack: b1-lgtm, otb.role: backend}
  # The chart injects GOMEMLIMIT (0.85 of the limit) and GOGC 80 whenever these are absent, and treats a factor
  # of 0 as unset. Compose runs Go's defaults, restated here.
  extraEnv:
    - {name: GOMEMLIMIT, value: "off"}
    - {name: GOGC, value: "100"}
  # loki.yaml keeps everything under /loki; the chart mounts the volume at /var/loki
  extraVolumeMounts:
    - {name: storage, mountPath: /loki}
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false

write: {replicas: 0}
read: {replicas: 0}
backend: {replicas: 0}

gateway: {enabled: false}
test: {enabled: false}
lokiCanary: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
memcached: {enabled: false}
ruler: {enabled: false}
sidecar:
  rules: {enabled: false}
monitoring:
  selfMonitoring: {enabled: false}
  serviceMonitor: {enabled: false}
  dashboards: {enabled: false}
  rules: {enabled: false}
rbac:
  namespaced: true
