# Generated by deploy/k8s/stacks/generate.py from stacks/b3-clickhouse/collector.yaml, stacks/b3-clickhouse/config/memory.xml, stacks/b3-clickhouse/config/profiles.xml. Edit those, then rerun it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-b3-config
  labels:
    otb.stack: b3-clickhouse
data:
  relay: |
    # ingest-b3: synchronous. No processors, no sending queue, bounded retry: the receiver's HTTP status is the
    # result of ClickHouse's INSERT. The exporter creates the otel schema (create_schema) with no TTL.
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 134217728

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse:9000?dial_timeout=10s
        database: otel
        username: default
        password: ${env:B3_CH_ADMIN_PASSWORD}
        create_schema: true
        ttl: 0
        timeout: 60s
        sending_queue: {enabled: false}
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull: {exporter: {prometheus: {host: 0.0.0.0, port: 8888}}}
      pipelines:
        traces: {receivers: [otlp], exporters: [clickhouse]}
        logs: {receivers: [otlp], exporters: [clickhouse]}
        metrics: {receivers: [otlp], exporters: [clickhouse]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  labels:
    otb.stack: b3-clickhouse
data:
  memory.xml: |
    <!-- Server memory bound so ClickHouse stays inside its compose budget (mounted into config.d). -->
    <clickhouse>
        <max_server_memory_usage_to_ram_ratio>0.8</max_server_memory_usage_to_ram_ratio>
        <mark_cache_size>268435456</mark_cache_size>
        <logger><level>warning</level></logger>
    </clickhouse>
  profiles.xml: |
    <!-- Query limits (mounted into users.d). Per-query memory comes from the profile; spilling is on so a large
         GROUP BY or ORDER BY degrades to disk instead of failing. otb_agent is the read-only profile the MCP
         server's user is bound to (created by post_up). -->
    <clickhouse>
        <profiles>
            <default>
                <max_memory_usage from_env="B3_MAX_QUERY_MEMORY"/>
                <max_bytes_before_external_group_by from_env="B3_SPILL_BYTES"/>
                <max_bytes_before_external_sort from_env="B3_SPILL_BYTES"/>
            </default>
            <otb_agent>
                <readonly>2</readonly>
                <max_memory_usage from_env="B3_MAX_QUERY_MEMORY"/>
                <max_bytes_before_external_group_by from_env="B3_SPILL_BYTES"/>
                <max_bytes_before_external_sort from_env="B3_SPILL_BYTES"/>
                <max_execution_time>120</max_execution_time>
                <constraints>
                    <max_memory_usage><readonly/></max_memory_usage>
                    <max_execution_time><readonly/></max_execution_time>
                </constraints>
            </otb_agent>
        </profiles>
    </clickhouse>
