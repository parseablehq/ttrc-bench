# Generated by deploy/k8s/stacks/generate.py from deploy/k8s/stacks/b4-parseable/parseable_env.py, stacks/b4-parseable/collector.yaml. Edit those, then rerun it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-b4-config
  labels:
    otb.stack: b4-parseable
data:
  relay: |
    # ingest-b4: synchronous. No sending queue, bounded retry: the receiver's HTTP status is Parseable's answer.
    # Parseable OSS rejects OTLP protobuf, so every exporter sends JSON, one stream per signal. The transform
    # processors work around three Parseable ingest defects (PARSEABLE-INGEST-DEFECTS.md 4, 5, 7) and are disclosed
    # in stack.yaml: integer points are sent as doubles, exemplars are dropped, and a log record without
    # timeUnixNano takes its observedTimeUnixNano.
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/parseable:
        client_auth:
          username: ${env:B4_PARSEABLE_USERNAME}
          password: ${env:B4_PARSEABLE_PASSWORD}

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 134217728

    processors:
      transform/b4_metrics:
        error_mode: propagate
        metric_statements:
          - context: datapoint
            statements:
              - set(exemplars, nil)
              - set(value_double, Double(value_int)) where value_double == 0.0
      transform/b4_logs:
        error_mode: propagate
        log_statements:
          - context: log
            statements:
              - set(time_unix_nano, observed_time_unix_nano) where time_unix_nano == 0

    exporters:
      otlphttp/traces:
        endpoint: http://parseable:8000
        encoding: json
        auth: {authenticator: basicauth/parseable}
        headers: {X-P-Stream: otel_traces}
        timeout: 60s
        sending_queue: {enabled: false}
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}
      otlphttp/logs:
        endpoint: http://parseable:8000
        encoding: json
        auth: {authenticator: basicauth/parseable}
        headers: {X-P-Stream: otel_logs}
        timeout: 60s
        sending_queue: {enabled: false}
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}
      otlphttp/metrics:
        endpoint: http://parseable:8000
        encoding: json
        auth: {authenticator: basicauth/parseable}
        headers: {X-P-Stream: otel_metrics}
        timeout: 60s
        sending_queue: {enabled: false}
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}

    service:
      extensions: [health_check, basicauth/parseable]
      telemetry:
        metrics:
          readers:
            - pull: {exporter: {prometheus: {host: 0.0.0.0, port: 8888}}}
      pipelines:
        traces: {receivers: [otlp], exporters: [otlphttp/traces]}
        logs: {receivers: [otlp], processors: [transform/b4_logs], exporters: [otlphttp/logs]}
        metrics: {receivers: [otlp], processors: [transform/b4_metrics], exporters: [otlphttp/metrics]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parseable-env-script
  labels:
    otb.stack: b4-parseable
data:
  parseable_env.py: |
    """The parseable-env Secret the Parseable chart reads (fixed keys addr, username, password), copied from the
    otb-credentials Secret the runtime applies, plus every key of STORE_SECRET when it exists (gke: gcs.url and
    gcs.bucket). Writes only when the copy differs, so every `up` can run it (the Job deletes itself after it
    finishes)."""

    import base64
    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.request
    from pathlib import Path

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    NAMESPACE = Path(f"{SA_DIR}/namespace").read_text().strip()
    API = f"https://kubernetes.default.svc/api/v1/namespaces/{NAMESPACE}/secrets"
    AUTH = "Bearer " + Path(f"{SA_DIR}/token").read_text().strip()
    TLS = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
    TARGET = os.environ["TARGET_SECRET"]


    def call(method: str, url: str, body: object = None) -> tuple[int, dict]:
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(url, data=data, method=method, headers={"Authorization": AUTH})
        if data is not None:
            req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=30, context=TLS) as r:
                return r.status, json.loads(r.read())
        except urllib.error.HTTPError as e:
            return e.code, json.loads(e.read() or b"{}")


    status, source = call("GET", f"{API}/{os.environ['SOURCE_SECRET']}")
    if status != 200:
        sys.exit(f"GET secret {os.environ['SOURCE_SECRET']} -> HTTP {status}: {source}")
    creds = {k: base64.b64decode(v).decode() for k, v in source["data"].items()}
    want = {
        "addr": os.environ["P_ADDR"],
        "username": creds[os.environ["USERNAME_KEY"]],
        "password": creds[os.environ["PASSWORD_KEY"]],
    }
    status, store = call("GET", f"{API}/{os.environ['STORE_SECRET']}")
    if status == 200:
        want |= {k: base64.b64decode(v).decode() for k, v in store["data"].items()}
    elif status != 404:
        sys.exit(f"GET secret {os.environ['STORE_SECRET']} -> HTTP {status}: {store}")
    data = {k: base64.b64encode(v.encode()).decode() for k, v in want.items()}
    body = {
        "apiVersion": "v1",
        "kind": "Secret",
        "metadata": {"name": TARGET, "labels": {"otb.stack": "b4-parseable"}},
        "type": "Opaque",
        "data": data,
    }

    status, current = call("GET", f"{API}/{TARGET}")
    if status == 200 and current.get("data") == data:
        print(f"{TARGET}: unchanged")
    elif status == 200:
        status, out = call("PUT", f"{API}/{TARGET}", body)
        print(f"{TARGET}: updated" if status == 200 else sys.exit(f"PUT {TARGET} -> HTTP {status}: {out}"))
    elif status == 404:
        status, out = call("POST", API, body)
        print(f"{TARGET}: created" if status == 201 else sys.exit(f"POST {TARGET} -> HTTP {status}: {out}"))
    else:
        sys.exit(f"GET secret {TARGET} -> HTTP {status}: {current}")
