# Every stack's ingest collector (compose service ingest-<n>) on the open-telemetry chart. generate.py writes
# <stack>/collector.yaml from this file plus the stack's name, labels, credentials and ConfigMap (key `relay`,
# the stack's collector.yaml byte for byte). Resources come from the profile.
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
command:
  name: otelcol-contrib
# compose gates no traffic on readiness: a backend slow to answer /ready under load stays in its Service (5 min)
readinessProbe:
  failureThreshold: 30
# compose sets no GOMEMLIMIT
useGOMEMLIMIT: false

# compose publishes 4318 (OTLP/HTTP), 13133 (health_check) and 8888 (self-telemetry)
ports:
  otlp: {enabled: false}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
    protocol: TCP
  health:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
