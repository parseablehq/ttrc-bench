# One OpenTelemetry Demo instance feeding TTRC-Bench, for open-telemetry/opentelemetry-demo chart 0.42.3. Install it with
# deploy/k8s/demo/install.sh <instance> [kind|gke], which adds profile-<profile>.yaml (every container's cpu and
# memory) and sets global.otb.instance and global.otb.gateway. NOTES.md says what differs from the Compose capture.
#
# The services, their ports, their environment and their image digests are those of the Compose capture
# (capture/demo-source-local.yaml, `docker compose config` of capture/demo-overlay/compose.otb.yaml on the 3.1.0
# checkout), not the chart's defaults: the chart moves every service to port 8080 and adds Kafka, the agent, the
# chatbot, MCP and OpAMP, which the Compose capture does not run. tests/k8s/demo_check.py compares the two.
global:
  otb:
    instance: ""
    gateway: http://otb-gateway.otb.svc.cluster.local:4318
    queueSize: 10Gi

jaeger: { enabled: false }
prometheus: { enabled: false }
grafana: { enabled: false }
opensearch: { enabled: false }
otel-ebpf-profiler: { enabled: false }

default:
  image:
    repository: ghcr.io/open-telemetry/demo
    pullPolicy: IfNotPresent

components:
  accounting: { enabled: false }
  agent: { enabled: false }
  chatbot: { enabled: false }
  fraud-detection: { enabled: false }
  kafka: { enabled: false }
  mcp: { enabled: false }
  opamp-server: { enabled: false }
  firepit: { enabled: false }

  ad:
    useDefault: { env: false }
    imageOverride: { tag: "latest-ad@sha256:a627c85d919c28fe6279534c1c7bcc04941e0a981cca53f0ef8f59fa28a7fa59" }
    service: { port: 9555 }
    env:
      - { name: AD_PORT, value: "9555" }
      - { name: AD_PROMETHEUS_PORT, value: "9465" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION, value: "latest" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=medium" }
      - { name: OTEL_SERVICE_NAME, value: "ad" }

  astronomy-db:
    imageOverride: { repository: postgres, tag: "18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636" }

  cart:
    useDefault: { env: false }
    imageOverride: { tag: "latest-cart@sha256:1f74a6f951f2fc819e8936b3ca52ecb725ddd2043e808e1075c02b197869b08b" }
    service: { port: 7070 }
    env:
      - { name: ASPNETCORE_URLS, value: "http://*:7070" }
      - { name: CART_PORT, value: "7070" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=high" }
      - { name: OTEL_SERVICE_NAME, value: "cart" }
      - { name: VALKEY_ADDR, value: "valkey-cart:6379" }
    initContainers:
      - name: wait-for-valkey-cart
        image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]
        resources: &init { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 10m, memory: 16Mi } }

  checkout:
    useDefault: { env: false }
    imageOverride: { tag: "latest-checkout@sha256:6803df8c2a128bde1e4188d1f3234ef6b27e47d08b06ba0c28a073a9be0a4856" }
    service: { port: 5050 }
    env:
      - { name: CART_ADDR, value: "cart:7070" }
      - { name: CHECKOUT_PORT, value: "5050" }
      - { name: CURRENCY_ADDR, value: "currency:7001" }
      - { name: EMAIL_ADDR, value: "http://email:6060" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: GOMEMLIMIT, value: "16MiB" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
      - { name: OTEL_GO_X_OBSERVABILITY, value: "true" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=critical" }
      - { name: OTEL_SERVICE_NAME, value: "checkout" }
      - { name: PAYMENT_ADDR, value: "payment:50051" }
      - { name: PRODUCT_CATALOG_ADDR, value: "product-catalog:3550" }
      - { name: SHIPPING_ADDR, value: "http://shipping:50050" }
    # The chart waits for Kafka here; the Compose capture runs no Kafka.
    initContainers: []

  currency:
    useDefault: { env: false }
    imageOverride: { tag: "latest-currency@sha256:a1542f8f40f5c6eeacb85f2f5e91ed43f71bf26670d575e137fd3a6e705fc2f7" }
    service: { port: 7001 }
    env:
      - { name: CURRENCY_PORT, value: "7001" }
      - { name: IPV6_ENABLED, value: "false" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=high" }
      - { name: OTEL_SERVICE_NAME, value: "currency" }
      - { name: VERSION, value: "3.0.0" }

  email:
    useDefault: { env: false }
    imageOverride: { tag: "latest-email@sha256:a882adabf4a5bf2e3108909f41e030aa4fad0684647eaee1754d3243ca9dce37" }
    service: { port: 6060 }
    env:
      - { name: APP_ENV, value: "production" }
      - { name: EMAIL_PORT, value: "6060" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=medium" }
      - { name: OTEL_SERVICE_NAME, value: "email" }

  # flagd-ui is a sidecar of flagd in the chart, so FLAGD_UI_HOST is flagd and flagd-ui's resources live in the
  # profiles, which restate sidecarContainers (a list, so a profile cannot merge into it).
  flagd:
    useDefault: { env: false }
    imageOverride: { repository: ghcr.io/open-feature/flagd, tag: "v0.16.0@sha256:32234e63c1d0634883aabd31cbd46802934aaaef0153dfd653b5d1017940bb4e" }
    env:
      - { name: GOMEMLIMIT, value: "60MiB" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low" }
      - { name: OTEL_SERVICE_NAME, value: "flagd" }
    initContainers:
      - name: init-config
        image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
        volumeMounts:
          - { mountPath: /config-ro, name: config-ro }
          - { mountPath: /config-rw, name: config-rw }
        resources: *init

  frontend:
    useDefault: { env: false }
    imageOverride: { tag: "latest-frontend@sha256:e75ad3c5c75c2b1cf83e495502eedc62a091ea5bea58503afdb8c7eaa9710c90" }
    service: { port: 8080 }
    env:
      - { name: AD_ADDR, value: "ad:9555" }
      - { name: CART_ADDR, value: "cart:7070" }
      - { name: CHECKOUT_ADDR, value: "checkout:5050" }
      - { name: CURRENCY_ADDR, value: "currency:7001" }
      - { name: ENV_PLATFORM, value: "local" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: FRONTEND_ADDR, value: "frontend:8080" }
      - { name: OTEL_COLLECTOR_HOST, value: "otel-collector" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=critical" }
      - { name: OTEL_SERVICE_NAME, value: "frontend" }
      - { name: PORT, value: "8080" }
      - { name: PRODUCT_CATALOG_ADDR, value: "product-catalog:3550" }
      - { name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://localhost:8080/otlp-http/v1/traces" }
      - { name: RECOMMENDATION_ADDR, value: "recommendation:9001" }
      - { name: SHIPPING_ADDR, value: "http://shipping:50050" }
      - { name: WEB_OTEL_SERVICE_NAME, value: "frontend-web" }

  frontend-proxy:
    useDefault: { env: false }
    imageOverride: { tag: "latest-frontend-proxy@sha256:89f6ae9f3d39b179087dacd28d2e1a0dae3f231f858c3c7214b8fae9dc98d1dd" }
    service: { port: 8080 }
    ports:
      - { name: admin, value: 10000 }
    env:
      - { name: CHATBOT_HOST, value: "chatbot" }
      - { name: CHATBOT_PORT, value: "7860" }
      - { name: ENVOY_ADDR, value: "0.0.0.0" }
      - { name: ENVOY_ADMIN_PORT, value: "10000" }
      - { name: ENVOY_PORT, value: "8080" }
      - { name: FIREPIT_HOST, value: "firepit" }
      - { name: FIREPIT_PORT, value: "8080" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: FLAGD_UI_HOST, value: "flagd" }
      - { name: FLAGD_UI_PORT, value: "4000" }
      - { name: FRONTEND_HOST, value: "frontend" }
      - { name: FRONTEND_PORT, value: "8080" }
      - { name: GRAFANA_HOST, value: "grafana" }
      - { name: GRAFANA_PORT, value: "3000" }
      - { name: IMAGE_PROVIDER_HOST, value: "image-provider" }
      - { name: IMAGE_PROVIDER_PORT, value: "8081" }
      - { name: JAEGER_HOST, value: "jaeger" }
      - { name: JAEGER_UI_PORT, value: "16686" }
      - { name: LOCUST_WEB_HOST, value: "load-generator" }
      - { name: LOCUST_WEB_PORT, value: "8089" }
      - { name: OPAMP_SERVER_HOST, value: "opamp-server" }
      - { name: OPAMP_SERVER_UI_PORT, value: "4321" }
      - { name: OTEL_COLLECTOR_HOST, value: "otel-collector" }
      - { name: OTEL_COLLECTOR_PORT_GRPC, value: "4317" }
      - { name: OTEL_COLLECTOR_PORT_HTTP, value: "4318" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=critical" }
      - { name: OTEL_SERVICE_NAME, value: "frontend-proxy" }
      - { name: OTEL_SERVICE_NAMESPACE, value: "opentelemetry-demo" }
      - { name: TELEMETRY_DOCS_HOST, value: "telemetry-docs" }
      - { name: TELEMETRY_DOCS_PORT, value: "8000" }

  image-provider:
    useDefault: { env: false }
    imageOverride: { tag: "latest-image-provider@sha256:8b78adc52028f867baaae4d2f0cf5466a79b2a31f93a01fc2e2d7d9ee246a814" }
    service: { port: 8081 }
    env:
      - { name: IMAGE_PROVIDER_PORT, value: "8081" }
      - { name: OTEL_COLLECTOR_HOST, value: "otel-collector" }
      - { name: OTEL_COLLECTOR_PORT_GRPC, value: "4317" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low" }
      - { name: OTEL_SERVICE_NAME, value: "image-provider" }

  load-generator:
    useDefault: { env: false }
    imageOverride: { tag: "latest-load-generator@sha256:8ad98c2b008522fe34dcf0b421ff4906fecad296613786c6421e019004673ccc" }
    service: { port: 8089 }
    env:
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_OFREP_PORT, value: "8016" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: LOCUST_AUTOSTART, value: "true" }
      - { name: LOCUST_BROWSER_TRAFFIC_ENABLED, value: "true" }
      - { name: LOCUST_BROWSER_USER_WEIGHT, value: "1" }
      - { name: LOCUST_HEADLESS, value: "false" }
      - { name: LOCUST_HOST, value: "http://frontend-proxy:8080" }
      - { name: LOCUST_HTTP_USER_WEIGHT, value: "9" }
      - { name: LOCUST_USERS, value: "5" }
      - { name: LOCUST_WEB_HOST, value: "0.0.0.0" }
      - { name: LOCUST_WEB_PORT, value: "8089" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED, value: "true" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low" }
      - { name: OTEL_SERVICE_NAME, value: "load-generator" }
      - { name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION, value: "python" }

  payment:
    useDefault: { env: false }
    imageOverride: { tag: "latest-payment@sha256:7552e1fe559e4d740bd2ffae5fb63b5db51be2a3d2e1db9f08553c10bd001024" }
    service: { port: 50051 }
    env:
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: IPV6_ENABLED, value: "false" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=critical" }
      - { name: OTEL_SERVICE_NAME, value: "payment" }
      - { name: PAYMENT_PORT, value: "50051" }

  product-catalog:
    useDefault: { env: false }
    imageOverride: { tag: "latest-product-catalog@sha256:9a7398db29925d33daafa454685110f5217514adfe0930da8eea1fd16221d860" }
    service: { port: 3550 }
    env:
      - { name: DB_CONNECTION_STRING, value: "postgres://astronomy_user:astronomy_password@astronomy-db/astronomy_db?sslmode=disable" }
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: GOMEMLIMIT, value: "16MiB" }
      - { name: OTEL_CONFIG_FILE, value: "/otel-config.yml" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_GO_X_OBSERVABILITY, value: "true" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=high" }
      - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: "database" }
      - { name: OTEL_SERVICE_NAME, value: "product-catalog" }
      - { name: PRODUCT_CATALOG_PORT, value: "3550" }
    # The checkout's otel-config.yml, which adds resource detectors the chart's copy lacks.
    mountedConfigMaps:
      - name: product-catalog-otel-config
        mountPath: /otel-config.yml
        subPath: otel-config.yml
        data:
          otel-config.yml: |
            file_format: "1.0"
            disabled: false
            log_level: info
            logger_provider:
              processors:
                - batch:
                    exporter:
                      otlp_grpc:
                        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            meter_provider:
              readers:
                - periodic:
                    exporter:
                      otlp_grpc:
                        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
                        temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
            tracer_provider:
              processors:
                - batch:
                    exporter:
                      otlp_grpc:
                        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            propagator:
              composite:
                - tracecontext:
                - baggage:
            resource:
              attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
              detection/development:
                detectors:
                  - container:
                  - host:
                  - process:
                  - service:
    initContainers:
      - name: wait-for-astronomy-db
        image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;"]
        resources: *init

  quote:
    useDefault: { env: false }
    imageOverride: { tag: "latest-quote@sha256:0e82843cf7edf7e9d00faac5fcda6202ef21e0f23aa6f95076738a6d1fb0ebc8" }
    service: { port: 8090 }
    env:
      - { name: IPV6_ENABLED, value: "false" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_PHP_AUTOLOAD_ENABLED, value: "true" }
      - { name: OTEL_PHP_INTERNAL_METRICS_ENABLED, value: "true" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low" }
      - { name: OTEL_SERVICE_NAME, value: "quote" }
      - { name: QUOTE_PORT, value: "8090" }

  recommendation:
    useDefault: { env: false }
    imageOverride: { tag: "latest-recommendation@sha256:c383035e0b3e7e077be8e8ed3470cdd94490f081deb45b17af0bac3124d26090" }
    service: { port: 9001 }
    env:
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_PYTHON_LOG_CORRELATION, value: "true" }
      - { name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED, value: "true" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=medium" }
      - { name: OTEL_SERVICE_NAME, value: "recommendation" }
      - { name: PRODUCT_CATALOG_ADDR, value: "product-catalog:3550" }
      - { name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION, value: "python" }
      - { name: RECOMMENDATION_PORT, value: "9001" }

  shipping:
    useDefault: { env: false }
    imageOverride: { tag: "latest-shipping@sha256:2aad4d6786a651519eeaf0f46cb97b9f8d6f6125c176bd0d8ce4ffd463dab7f7" }
    service: { port: 50050 }
    env:
      - { name: FLAGD_HOST, value: "flagd" }
      - { name: FLAGD_PORT, value: "8013" }
      - { name: IPV6_ENABLED, value: "false" }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: "explicit_bucket_histogram" }
      - { name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: "cumulative" }
      - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
      - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=high" }
      - { name: OTEL_SERVICE_NAME, value: "shipping" }
      - { name: QUOTE_ADDR, value: "http://quote:8090" }
      - { name: SHIPPING_PORT, value: "50050" }
    initContainers:
      - name: wait-for-flagd
        image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;"]
        resources: *init

  telemetry-docs:
    useDefault: { env: false }
    imageOverride: { tag: "latest-telemetry-docs@sha256:47b84fb723a4e811f2a0c0d81049ef96c3591a35cef70811c40c8ba1ea028f23" }
    service: { port: 8000 }
    env:
      - { name: OTEL_COLLECTOR_HOST, value: "otel-collector" }
      - { name: OTEL_COLLECTOR_PORT_GRPC, value: "4317" }
      - { name: OTEL_SERVICE_NAME, value: "telemetry-docs" }
      - { name: TELEMETRY_DOCS_PORT, value: "8000" }

  valkey-cart:
    imageOverride: { repository: ghcr.io/valkey-io/valkey, tag: "9.0.4-alpine3.23@sha256:107b203169a20ef7c87548c157f4e4a833dbbbd20fefd3a26740b7f98ac80216" }

opentelemetry-collector:
  mode: deployment
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: "0.159.0"
    digest: sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
  presets:
    hostMetrics: { enabled: false }
    kubernetesAttributes: { enabled: false }
    kubeletMetrics: { enabled: false }
    clusterMetrics: { enabled: false }
    annotationDiscovery: { metrics: { enabled: false } }
  ports:
    jaeger-compact: { enabled: false }
    jaeger-thrift: { enabled: false }
    jaeger-grpc: { enabled: false }
    zipkin: { enabled: false }
  # The file queue's PVC is ReadWriteOnce: the old pod must let go of it before the new one starts.
  rollout: { strategy: Recreate }
  podSecurityContext: { fsGroup: 10001 }
  extraEnvs:
    - { name: OTB_INSTANCE, value: '{{ required "set global.otb.instance" .Values.global.otb.instance }}' }
    - { name: OTB_GATEWAY, value: '{{ required "set global.otb.gateway" .Values.global.otb.gateway }}' }
    - { name: OTB_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
    - { name: K8S_NODE_IP, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
  extraVolumes:
    - { name: otb-queue, persistentVolumeClaim: { claimName: otb-queue } }
  extraVolumeMounts:
    - { name: otb-queue, mountPath: /var/lib/otelcol/otb-queue }
  # kubeletstats reads this node's kubelet, which needs nodes/stats; ClusterRoles are cluster-wide, so the names
  # carry the instance. Nothing else: no pod, namespace or node watch.
  extraManifests:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: otb-queue }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: "{{ .Values.global.otb.queueSize }}" } }
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: { name: "otb-demo-{{ .Values.global.otb.instance }}-kubeletstats" }
      rules:
        - { apiGroups: [""], resources: [nodes/stats], verbs: [get] }
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: { name: "otb-demo-{{ .Values.global.otb.instance }}-kubeletstats" }
      roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "otb-demo-{{ .Values.global.otb.instance }}-kubeletstats" }
      subjects:
        - { kind: ServiceAccount, name: '{{ include "opentelemetry-collector.serviceAccountName" . }}', namespace: "{{ .Release.Namespace }}" }

  # The whole collector config, so nothing of the chart's (Jaeger, Prometheus, OpenSearch, OpAMP, Kafka) is merged
  # in. It is the checkout's src/otel-collector/otelcol-config.yml with TTRC-Bench's overlay
  # (capture/demo-overlay/otelcol-otb.yml) applied, and three changes: the receivers bind the pod IP; host_metrics
  # keeps only the scrapers that read node-wide /proc files, as there is no host root filesystem; docker_stats is
  # replaced by kubeletstats, in a pipeline of its own that drops every other namespace's pods.
  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
            cors:
              allowed_origins: ["http://*", "https://*"]
              allowed_headers: ["content-type", "traceparent", "baggage"]
      http_check/frontend-proxy:
        targets:
          - endpoint: http://frontend-proxy:8080
      nginx:
        endpoint: http://image-provider:8081/status
        collection_interval: 10s
      redis:
        endpoint: valkey-cart:6379
        username: valkey
        collection_interval: 10s
      postgresql:
        endpoint: astronomy-db:5432
        username: monitoring_user
        password: monitoring_password
        metrics:
          postgresql.blks_hit: { enabled: true }
          postgresql.blks_read: { enabled: true }
          postgresql.tup_fetched: { enabled: true }
          postgresql.tup_returned: { enabled: true }
          postgresql.tup_inserted: { enabled: true }
          postgresql.tup_updated: { enabled: true }
          postgresql.tup_deleted: { enabled: true }
          postgresql.deadlocks: { enabled: true }
        tls: { insecure: true }
      prometheus/ad:
        config:
          scrape_configs:
            - job_name: ad
              scrape_interval: 10s
              static_configs:
                - targets: ["ad:9465"]
      host_metrics:
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization: { enabled: true }
          load: {}
          memory:
            metrics:
              system.memory.utilization: { enabled: true }
              system.memory.limit: { enabled: true }
          paging:
            metrics:
              system.paging.utilization: { enabled: true }
      kubeletstats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [container, pod]
        metrics:
          container.uptime: { enabled: true }
          k8s.pod.uptime: { enabled: true }

    exporters:
      debug: {}
      otlp_http/otb:
        endpoint: ${env:OTB_GATEWAY}
        encoding: json
        compression: gzip
        tls: { insecure: true }
        sending_queue: { enabled: true, queue_size: 100000, storage: file_storage/otb }
        retry_on_failure: { enabled: true, max_elapsed_time: 0s }

    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      file_storage/otb:
        directory: /var/lib/otelcol/otb-queue
        create_directory: true

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource_detection:
        detectors: [env, system]
        system:
          hostname_sources: ["os"]
          resource_attributes:
            host.arch: { enabled: true }
            host.cpu.vendor.id: { enabled: true }
            host.cpu.family: { enabled: true }
            host.cpu.model.id: { enabled: true }
            host.cpu.model.name: { enabled: true }
            host.cpu.stepping: { enabled: true }
            host.cpu.cache.l2.size: { enabled: true }
            os.description: { enabled: true }
      filter/sanitize_profiles:
        error_mode: ignore
        profiles:
          profile:
            - 'IsMatch(resource.attributes["service.name"], "containerd-shim-.*")'
      transform/sanitize_logs:
        error_mode: ignore
        log_statements:
          - context: scope
            statements:
              - set(attributes["otelcol_signal"], attributes["otelcol.signal"]) where attributes["otelcol.signal"] != nil and not IsMap(attributes["otelcol.signal"])
              - delete_key(attributes, "otelcol.signal") where attributes["otelcol_signal"] != nil
      gen_ai_normalizer:
        sources:
          - name: openllmetry
      transform/sanitize_spans:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set_semconv_span_name("1.43.0", "original_span_name")
      transform/redact_sensitive_data:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"] != nil
              - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
              - delete_key(attributes, "user.email") where attributes["user.email"] != nil
              - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-", "****-****-****-") where attributes["demo.payment.card_number"] != nil
      redaction:
        allow_all_keys: true
        ignored_keys:
          - demo.payment.card_number
        blocked_key_patterns:
          - "demo\\.payment\\.card_pin"
          - "password"
          - "secret"
        summary: info
      resource/otb_instance:
        attributes:
          - { key: cloud.region, value: "${env:OTB_INSTANCE}", action: upsert }
          - { key: service.instance.id, value: "${env:OTB_INSTANCE}", action: upsert }
      batch/otb:
        send_batch_size: 2000
        send_batch_max_size: 4000
        timeout: 2s
      # kubeletstats reports every pod on the node; keep this instance's.
      filter/otb_namespace:
        error_mode: ignore
        metrics:
          metric:
            - resource.attributes["k8s.namespace.name"] != "${env:OTB_NAMESPACE}"

    connectors:
      span_metrics: {}

    service:
      extensions: [health_check, file_storage/otb]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource_detection, memory_limiter, transform/sanitize_spans, gen_ai_normalizer, transform/redact_sensitive_data, redaction, resource/otb_instance, batch/otb]
          exporters: [otlp_http/otb, span_metrics]
        metrics:
          receivers: [http_check/frontend-proxy, host_metrics, nginx, otlp, redis, postgresql, prometheus/ad, span_metrics]
          processors: [resource_detection, memory_limiter, resource/otb_instance, batch/otb]
          exporters: [otlp_http/otb]
        metrics/kubeletstats:
          receivers: [kubeletstats]
          processors: [filter/otb_namespace, resource_detection, memory_limiter, resource/otb_instance, batch/otb]
          exporters: [otlp_http/otb]
        logs:
          receivers: [otlp]
          processors: [resource_detection, memory_limiter, transform/sanitize_logs, resource/otb_instance, batch/otb]
          exporters: [otlp_http/otb]
        profiles:
          receivers: [otlp]
          processors: [resource_detection, filter/sanitize_profiles, memory_limiter]
          exporters: [debug]
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp: { protocol: http/protobuf, endpoint: "http://otel-collector:4318" }
        logs:
          processors:
            - batch:
                exporter:
                  otlp: { protocol: http/protobuf, endpoint: "http://otel-collector:4318" }
