# EXAMPLE ONLY: every value below is fake. Copy this file outside the repo, put real values in, apply the copy.
#
# otb-stack-mcp: one key per stack, <stack>.env, holding only that stack's MCP reader credentials. Mounted in the
# tools container at /secrets.
apiVersion: v1
kind: Secret
metadata:
  name: otb-stack-mcp
  namespace: otb
type: Opaque
stringData:
  fixture-stdio.env: |
    FIXTURE_TOKEN=FAKE-fixture-token-not-a-secret
  fixture-http.env: |
    FIXTURE_TOKEN=FAKE-fixture-token-not-a-secret
    FIXTURE_HTTP_URL=http://fixture-mcp.otb-fx.svc:8765
---
# otb-stack-admin: provisioning credentials, as environment variables of the runner container only.
apiVersion: v1
kind: Secret
metadata:
  name: otb-stack-admin
  namespace: otb
type: Opaque
stringData:
  FIXTURE_ADMIN_PASSWORD: FAKE-admin-password-not-a-secret
---
# otb-model-credential: mounted in the agent container at /credentials. Set one of the three keys.
apiVersion: v1
kind: Secret
metadata:
  name: otb-model-credential
  namespace: otb
type: Opaque
stringData:
  api-key: sk-ant-FAKE-not-a-real-key
  # Or a Claude subscription token from `claude setup-token`:
  # oauth-token: sk-ant-oat01-FAKE
  # Or a Claude subscription login file:
  # claude-credentials.json: |
  #   {"claudeAiOauth": {"accessToken": "FAKE", "refreshToken": "FAKE", "expiresAt": 0}}
