# Generated by deploy/k8s/runner/generate.py from install.sh and pins.yaml. Edit those, then rerun it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otb-runner-install
  namespace: otb
data:
  install.sh: "#!/bin/sh\n# The runner pod's install init container (deploy/k8s/runner/statefulset.yaml): puts everything\
    \ the three\n# containers run onto the PVC at /work, from public, pinned sources, and converges on reruns. Runs as uid\
    \ 10001 on\n# a read-only root filesystem with /work and /tmp writable. The pins (versions, sha256 per architecture, expected\n\
    # python versions) come from the otb-runner-install ConfigMap, generated from pins.yaml.\n#\n#   /work/otb.bundle    \
    \   the otb checkout as a git bundle (kubectl cp it in; this script waits for it)\n#   /work/app              the checkout\
    \ at the bundle's HEAD, with its uv venv (.venv) and the .otb home\n#   /work/tools/bin        uv, kubectl, helm, claude\n\
    #   /work/tools/python     the uv-managed interpreters every venv links to\n#   /work/tools/dl         the verified archives,\
    \ kept so a restart re-verifies instead of re-downloading\n#   /work/tools/versions.json  what was installed, read by\
    \ otb run (agent.cli_version) and the tests\nset -eu\n\nTOOLS=/work/tools\nBIN=$TOOLS/bin\nDL=$TOOLS/dl\nAPP=/work/app\n\
    BUNDLE=/work/otb.bundle\nmkdir -p \"$BIN\" \"$DL\" \"$TOOLS/python\" \"$TOOLS/uv-cache\" /work/home /work/runs /work/corpora\n\
    \ncase \"$(uname -m)\" in\n  aarch64) ARCH=arm64 UV_ARCH=aarch64 CLAUDE_ARCH=arm64 ;;\n  x86_64) ARCH=amd64 UV_ARCH=x86_64\
    \ CLAUDE_ARCH=x64 ;;\n  *) echo \"install: no pins for $(uname -m)\" >&2; exit 1 ;;\nesac\n\n# fetch <url> <sha256> <file>:\
    \ download unless the file is already there with that sha256; refuse any other.\nfetch() {\n  if [ -f \"$3\" ] && echo\
    \ \"$2  $3\" | sha256sum -c --quiet 2>/dev/null; then return 0; fi\n  rm -f \"$3\" \"$3.part\"\n  curl -fsSL --retry 5\
    \ --retry-all-errors -o \"$3.part\" \"$1\"\n  if ! echo \"$2  $3.part\" | sha256sum -c --quiet; then\n    echo \"install:\
    \ $1: sha256 differs from the pin $2\" >&2\n    rm -f \"$3.part\"\n    exit 1\n  fi\n  mv \"$3.part\" \"$3\"\n}\n\n# place\
    \ <archive> <sha256> <member|-> <name>: the binary from a verified archive (or the raw file) into $BIN,\n# skipped when\
    \ the stamp says it came from the same archive.\nplace() {\n  stamp=\"$BIN/$4.sha256\"\n  if [ -x \"$BIN/$4\" ] && [ -f\
    \ \"$stamp\" ] && [ \"$(cat \"$stamp\")\" = \"$2\" ]; then return 0; fi\n  rm -rf /tmp/place && mkdir -p /tmp/place\n\
    \  if [ \"$3\" = \"-\" ]; then cp \"$1\" \"/tmp/place/$4\"; else tar -xzf \"$1\" -C /tmp/place \"$3\" && mv \"/tmp/place/$3\"\
    \ \"/tmp/place/$4\"; fi\n  chmod 0755 \"/tmp/place/$4\"\n  mv \"/tmp/place/$4\" \"$BIN/$4\"\n  echo \"$2\" > \"$stamp\"\
    \n}\n\npin() { eval \"echo \\\"\\$${1}_SHA256_$(echo \"$ARCH\" | tr a-z A-Z)\\\"\"; }\n\nfetch \"$(echo \"$UV_URL\" |\
    \ sed \"s/{version}/$UV_VERSION/g; s/{uv_arch}/$UV_ARCH/g\")\" \"$(pin UV)\" \"$DL/uv-$UV_VERSION-$ARCH.tar.gz\"\nplace\
    \ \"$DL/uv-$UV_VERSION-$ARCH.tar.gz\" \"$(pin UV)\" \"uv-$UV_ARCH-unknown-linux-gnu/uv\" uv\nfetch \"$(echo \"$KUBECTL_URL\"\
    \ | sed \"s/{version}/$KUBECTL_VERSION/g; s/{arch}/$ARCH/g\")\" \"$(pin KUBECTL)\" \"$DL/kubectl-$KUBECTL_VERSION-$ARCH\"\
    \nplace \"$DL/kubectl-$KUBECTL_VERSION-$ARCH\" \"$(pin KUBECTL)\" - kubectl\nfetch \"$(echo \"$HELM_URL\" | sed \"s/{version}/$HELM_VERSION/g;\
    \ s/{arch}/$ARCH/g\")\" \"$(pin HELM)\" \"$DL/helm-$HELM_VERSION-$ARCH.tar.gz\"\nplace \"$DL/helm-$HELM_VERSION-$ARCH.tar.gz\"\
    \ \"$(pin HELM)\" \"linux-$ARCH/helm\" helm\nfetch \"$(echo \"$CLAUDE_URL\" | sed \"s/{version}/$CLAUDE_VERSION/g; s/{claude_arch}/$CLAUDE_ARCH/g\"\
    )\" \"$(pin CLAUDE)\" \"$DL/claude-$CLAUDE_VERSION-$ARCH.tgz\"\nplace \"$DL/claude-$CLAUDE_VERSION-$ARCH.tgz\" \"$(pin\
    \ CLAUDE)\" package/claude claude\n\nexport PATH=\"$BIN:$PATH\" HOME=/work/home TMPDIR=/tmp\nexport UV_PYTHON_INSTALL_DIR=\"\
    $TOOLS/python\" UV_CACHE_DIR=\"$TOOLS/uv-cache\" UV_LINK_MODE=copy\n# only the interpreters on the PVC: the image's python\
    \ is not in tools or agent, so no venv may link to it\nexport UV_PYTHON_PREFERENCE=only-managed\nexport DISABLE_AUTOUPDATER=1\
    \ CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1\n\ngot=\"$(claude --version | sed 's/ .*//')\"\nif [ \"$got\" != \"$CLAUDE_VERSION\"\
    \ ]; then echo \"install: claude reports $got, pinned $CLAUDE_VERSION\" >&2; exit 1; fi\n\n# uv checks each interpreter's\
    \ sha256 against its own manifest; the pin here keeps uv's choice visible.\nuv python install --quiet 3.12 3.13\nversion_of()\
    \ { \"$(uv python find \"$1\")\" -c 'import platform; print(platform.python_version())'; }\nfor want in $PYTHON_VERSIONS;\
    \ do\n  minor=\"${want%.*}\"\n  have=\"$(version_of \"$minor\")\"\n  if [ \"$have\" != \"$want\" ]; then echo \"install:\
    \ uv resolved python $minor to $have, pinned $want\" >&2; exit 1; fi\ndone\n\n# kubectl cp creates the file before it\
    \ has written it, so the bundle arrives as $BUNDLE.part and is renamed;\n# a bundle that does not clone (an older copy\
    \ cut short) or names no HEAD to check out is dropped and waited for\n# again, before anything in $APP is touched\nwhile\
    \ :; do\n  while [ ! -f \"$BUNDLE\" ]; do\n    echo \"install: waiting for $BUNDLE (kubectl cp <bundle> otb-runner-0:$BUNDLE.part\
    \ -c install, then mv it)\"\n    sleep 10\n  done\n  rm -rf /tmp/bundle-check\n  want=\"\"\n  if git clone --quiet --bare\
    \ \"$BUNDLE\" /tmp/bundle-check; then\n    want=\"$(git bundle list-heads \"$BUNDLE\" HEAD | cut -d' ' -f1)\"\n  fi\n\
    \  [ -n \"$want\" ] && break\n  echo \"install: $BUNDLE does not clone or has no HEAD (git bundle create <file> HEAD <branch>),\
    \ removing it\" >&2\n  rm -f \"$BUNDLE\"\ndone\nrm -rf /tmp/bundle-check\nif [ -d \"$APP/.git\" ] && [ \"$(git -C \"$APP\"\
    \ rev-parse HEAD 2>/dev/null)\" = \"$want\" ]; then\n  echo \"install: $APP is at $want\"\nelse\n  # what otb keeps inside\
    \ its checkout outlives the checkout: the charts, secrets and server environments\n  # (.otb), the ingest sessions (state),\
    \ the suites, and the venv (uv sync then only verifies it)\n  # /work/keep is the only copy while the checkout is replaced:\
    \ an install cut short in between left it there,\n  # and the rerun restores it rather than starting it over\n  mkdir\
    \ -p /work/keep\n  for d in .otb state suites .venv; do\n    if [ -e \"$APP/$d\" ] && [ ! -e \"/work/keep/$d\" ]; then\
    \ mv \"$APP/$d\" \"/work/keep/$d\"; fi\n  done\n  kept=\"$(ls -A /work/keep | tr '\\n' ' ')\"\n  rm -rf \"$APP\"\n  git\
    \ clone --quiet \"$BUNDLE\" \"$APP\"\n  git -C \"$APP\" checkout --quiet --detach \"$want\"\n  for d in .otb state suites\
    \ .venv; do\n    if [ -e \"/work/keep/$d\" ]; then rm -rf \"${APP:?}/$d\" && mv \"/work/keep/$d\" \"$APP/$d\"; fi\n  done\n\
    \  echo \"install: $APP re-cloned at $want, kept: $kept\"\nfi\ncd \"$APP\"\nuv sync --frozen --all-groups --python 3.12\n\
    mkdir -p .otb/servers .otb/bin .otb/venvs .otb/node state suites\nif [ -n \"$(git status --porcelain)\" ]; then echo \"\
    install: the checkout is dirty after sync:\" >&2; git status --porcelain >&2; exit 1; fi\n\npython_versions=\"$(version_of\
    \ 3.12),$(version_of 3.13)\"\ncat > \"$TOOLS/versions.json\" <<JSON\n{\"arch\": \"$ARCH\", \"uv\": \"$(uv --version |\
    \ sed 's/uv //; s/ .*//')\", \"kubectl\": \"$KUBECTL_VERSION\", \"helm\": \"$(helm version --template '{{.Version}}')\"\
    ,\n \"claude\": \"$got\", \"python\": \"$python_versions\", \"otb_commit\": \"$want\"}\nJSON\ncat \"$TOOLS/versions.json\"\
    \necho \"install: done\"\n"
  UV_VERSION: 0.13.0
  UV_URL: https://github.com/astral-sh/uv/releases/download/{version}/uv-{uv_arch}-unknown-linux-gnu.tar.gz
  UV_SHA256_ARM64: 3ccfb6af6e242433eb552f7d9676abd5412c6595c497e990d9c8cb7b5bd4d2c3
  UV_SHA256_AMD64: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154
  KUBECTL_VERSION: v1.37.0
  KUBECTL_URL: https://dl.k8s.io/release/{version}/bin/linux/{arch}/kubectl
  KUBECTL_SHA256_ARM64: 922df28df248cc00a9e025f947704f1d1482de64ece54cfe57e61f19eaf1eef3
  KUBECTL_SHA256_AMD64: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
  HELM_VERSION: v4.3.0
  HELM_URL: https://get.helm.sh/helm-{version}-linux-{arch}.tar.gz
  HELM_SHA256_ARM64: 31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08
  HELM_SHA256_AMD64: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  CLAUDE_VERSION: 2.1.295
  CLAUDE_URL: https://registry.npmjs.org/@anthropic-ai/claude-code-linux-{claude_arch}/-/claude-code-linux-{claude_arch}-{version}.tgz
  CLAUDE_SHA256_ARM64: 931e64de4906046d2fc4d5a3c2daa9a27dc6397525c25f136cb8348749abcb51
  CLAUDE_SHA256_AMD64: d45a2fa14a7ea0b8ab4f56e502de5893c2b816078c71c4d8ab2e4142148f3d95
  PYTHON_VERSIONS: 3.12.15 3.13.16
