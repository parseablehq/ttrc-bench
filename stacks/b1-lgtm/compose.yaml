# B1 federated OSS: Prometheus, Loki, Tempo and Grafana as separate containers with mounted configs.
# Paths are relative to the repo root (--project-directory).
services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=${B1_PROMETHEUS_RETENTION_SIZE}
      - --web.enable-otlp-receiver
      - --query.timeout=2m
    volumes:
      - b1-prometheus:/prometheus
      - ./stacks/b1-lgtm/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:31090:9090"]
    cpus: ${B1_PROMETHEUS_CPUS}
    mem_limit: ${B1_PROMETHEUS_MEM}
    labels: {otb.stack: b1-lgtm, otb.role: backend}
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yaml", "-target=all"]
    volumes:
      - b1-loki:/loki
      - ./stacks/b1-lgtm/config/loki.yaml:/etc/loki/loki.yaml:ro
    ports: ["127.0.0.1:31100:3100"]
    cpus: ${B1_LOKI_CPUS}
    mem_limit: ${B1_LOKI_MEM}
    labels: {otb.stack: b1-lgtm, otb.role: backend}
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: ["-config.file=/etc/tempo/tempo.yaml", "-target=all"]
    user: "0:0"
    volumes:
      - b1-tempo:/var/tempo
      - ./stacks/b1-lgtm/config/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports: ["127.0.0.1:31200:3200"]
    cpus: ${B1_TEMPO_CPUS}
    mem_limit: ${B1_TEMPO_MEM}
    labels: {otb.stack: b1-lgtm, otb.role: backend}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_USER: ${B1_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${B1_GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - b1-grafana:/var/lib/grafana
      - ./stacks/b1-lgtm/config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/otb.yaml:ro
    ports: ["127.0.0.1:31300:3000"]
    cpus: ${B1_GRAFANA_CPUS}
    mem_limit: ${B1_GRAFANA_MEM}
    labels: {otb.stack: b1-lgtm, otb.role: backend}
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  ingest-b1:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./stacks/b1-lgtm/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4381:4318", "127.0.0.1:13381:13133", "127.0.0.1:18881:8888"]
    cpus: ${INGEST_CPUS}
    mem_limit: ${INGEST_MEM}
    labels: {otb.stack: b1-lgtm, otb.role: ingest}
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

volumes:
  b1-prometheus:
  b1-loki:
  b1-tempo:
  b1-grafana:
