# ingest-b1: synchronous fan-in to three backends. No processors, no sending queue, bounded retry: the receiver's
# HTTP status is the backend's answer for that signal (Prometheus OTLP, Loki OTLP, Tempo OTLP).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 134217728

exporters:
  otlphttp/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    timeout: 60s
    sending_queue: {enabled: false}
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    timeout: 60s
    sending_queue: {enabled: false}
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}
  otlphttp/tempo:
    traces_endpoint: http://tempo:4318/v1/traces
    timeout: 60s
    sending_queue: {enabled: false}
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 20s}

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull: {exporter: {prometheus: {host: 0.0.0.0, port: 8888}}}
  pipelines:
    traces: {receivers: [otlp], exporters: [otlphttp/tempo]}
    logs: {receivers: [otlp], exporters: [otlphttp/loki]}
    metrics: {receivers: [otlp], exporters: [otlphttp/prometheus]}
