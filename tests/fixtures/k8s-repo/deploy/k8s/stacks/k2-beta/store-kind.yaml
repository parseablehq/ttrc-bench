apiVersion: apps/v1
kind: StatefulSet
metadata: {name: store, namespace: otb-k2}
spec:
  replicas: 1
  template:
    metadata: {labels: {otb.stack: k2-beta, otb.role: backend}}
    spec:
      containers:
        - name: store
          image: fx/store:1.0.0@sha256:2222222222222222222222222222222222222222222222222222222222222222
          resources: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: store-setup, namespace: otb-k2}
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata: {labels: {otb.stack: k2-beta, otb.role: setup}}
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: fx/setup:1.0.0@sha256:3333333333333333333333333333333333333333333333333333333333333333
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 100m, memory: 64Mi}}
